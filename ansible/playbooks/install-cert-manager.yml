---
- name: Install cert-manager and Let's Encrypt issuer
  hosts: k3s
  become: true

  vars:
    cert_manager_version: "v1.16.2"
    acme_email: "admin@tonibyte.dev"   # лучше из переменной/secret

  tasks:
    - name: Install cert-manager manifests
      command: >
        k3s kubectl apply
        -f https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.yaml

    - name: Wait for cert-manager webhook
      command: >
        k3s kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=300s
      changed_when: false

    - name: Wait for cert-manager controller
      command: >
        k3s kubectl -n cert-manager rollout status deployment/cert-manager --timeout=300s
      changed_when: false

    - name: Create ClusterIssuer manifest
      copy:
        dest: /tmp/cluster-issuer.yaml
        content: |
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              email: {{ acme_email }}
              server: https://acme-v02.api.letsencrypt.org/directory
              privateKeySecretRef:
                name: letsencrypt-prod
              solvers:
                - http01:
                    ingress:
                      class: traefik

    - name: Apply ClusterIssuer
      command: k3s kubectl apply -f /tmp/cluster-issuer.yaml

    - name: Show ClusterIssuer status
      command: k3s kubectl get clusterissuer
      register: issuers
      changed_when: false

    - debug:
        var: issuers.stdout